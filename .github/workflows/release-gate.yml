name: release-gate

# A release tag must not carry documentation that still waits on numbers:
# release/slot_gate.py fails while any [[CALIB-nn]] slot token remains.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pending-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python release/slot_gate.py
